<style>
/* Layout: app del dueño (barra lateral en compu, pestañas abajo en celu) + vista pública del socio (?g=slug). Azul noche, acento = color del gym. */
:root{
  --bg:#060D1A; --bg2:#0A1526; --card:#0E1C33; --card2:#132541; --line:#1C3050; --line2:#284268;
  --fg:#EEF4FC; --muted:#9DB0CA; --dim:#7489A8;
  --acc:#38B5FE; --accInk:#03121F; --accSoft:rgba(56,181,254,.13); --accLine:rgba(56,181,254,.38);
  --ok:#2FD08A; --bad:#FF6B6B; --warn:#FFB547;
  --display:'Sora','Segoe UI',system-ui,sans-serif; --body:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif; --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15.5px;line-height:1.55;-webkit-font-smoothing:antialiased;
  padding-top:env(safe-area-inset-top,0px);padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--acc)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:8px}
[hidden]{display:none!important}
h1,h2,h3{font-family:var(--display);letter-spacing:-.02em;margin:0;text-wrap:balance}
.btn{min-height:46px;padding:0 18px;border-radius:12px;border:0;background:var(--acc);color:var(--accInk);font-weight:800;font-size:15px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;white-space:nowrap}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.55;cursor:wait}
.btn.ghost{background:transparent;color:var(--fg);border:1.5px solid var(--line2)}
.btn.ghost:hover{border-color:var(--acc);background:var(--accSoft)}
.btn.sm{min-height:36px;padding:0 12px;font-size:13.5px;border-radius:10px}
.btn.wa{background:var(--ok);color:#03140C}
.btn.danger{background:transparent;color:var(--bad);border:1.5px solid rgba(255,107,107,.4)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>span{font-size:13.5px;font-weight:700;color:var(--muted)}
.field small{font-size:12.5px;color:var(--dim)}
input[type=text],input[type=email],input[type=password],input[type=tel],input[type=number],input[type=search],select,textarea{width:100%;min-height:46px;background:var(--bg2);border:1.5px solid var(--line2);border-radius:12px;padding:10px 12px;font-size:15.5px}
textarea{min-height:96px;resize:vertical;line-height:1.5}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;min-width:0}
.lbl{font-family:var(--mono);font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.muted{color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:800px){.grid2,.grid3{grid-template-columns:1fr}}
.stack{display:flex;flex-direction:column;gap:14px}
.rowx{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.chip{display:inline-block;font-size:12px;font-weight:800;border-radius:999px;padding:4px 10px;white-space:nowrap}
.c-ok{background:rgba(47,208,138,.14);color:var(--ok)}
.c-acc{background:var(--accSoft);color:var(--acc)}
.c-warn{background:rgba(255,181,71,.14);color:var(--warn)}
.c-bad{background:rgba(255,107,107,.14);color:var(--bad)}
.c-dim{background:var(--card2);color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);opacity:0;pointer-events:none;z-index:90;background:var(--fg);color:var(--bg);font-weight:800;border-radius:14px;padding:12px 18px;max-width:calc(100% - 32px);transition:.25s;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.err{background:var(--bad);color:#200}
.empty{border:1.5px dashed var(--line2);border-radius:16px;padding:22px;text-align:center;color:var(--muted)}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:20px;text-decoration:none;color:var(--fg)}
.logo i{width:32px;height:32px;border-radius:9px;background:var(--acc);color:var(--accInk);display:grid;place-items:center;flex-shrink:0;overflow:hidden;font-style:normal}
.logo i img{width:100%;height:100%;object-fit:cover}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid var(--line2);border-top-color:var(--acc);animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.loading{min-height:70vh;display:grid;place-items:center}

/* Auth */
.auth{min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}

.auth .side h2{font-size:clamp(28px,3vw,40px);line-height:1.1}
.auth .side ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:12px;color:var(--muted)}
.auth .side li{display:flex;gap:10px}
.auth .side li b{color:var(--fg)}
.auth .side{}
@media (max-width:900px){.auth{grid-template-columns:1fr}.auth .side{display:none}}
.auth .form{display:flex;flex-direction:column;justify-content:center;padding:32px max(16px,env(safe-area-inset-left,0px));max-width:460px;width:100%;margin:0 auto;gap:18px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}
.seg button{min-height:40px;border:0;border-radius:9px;background:transparent;color:var(--muted);font-weight:800;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--card2);color:var(--fg);box-shadow:inset 0 0 0 1px var(--line2)}
.msgbox{font-size:14px;border-radius:12px;padding:12px 14px;background:var(--accSoft);border:1px solid var(--accLine)}
.msgbox.err{background:rgba(255,107,107,.1);border-color:rgba(255,107,107,.4);color:#FFC2C2}

/* App shell */
.shell{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
@media (max-width:900px){.shell{grid-template-columns:1fr}}
.sidebar{position:sticky;top:0;height:100vh;border-right:1px solid var(--line);background:var(--bg2);padding:20px 14px;display:flex;flex-direction:column;gap:6px}
@media (max-width:900px){.sidebar{display:none}}
.nav-b{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 12px;border-radius:12px;border:0;background:transparent;color:var(--muted);font-weight:700;cursor:pointer;text-align:left;width:100%}
.nav-b:hover{background:var(--card);color:var(--fg)}
.nav-b[aria-current=page]{background:var(--accSoft);color:var(--acc)}
.sidebar .bottom{margin-top:auto;display:flex;flex-direction:column;gap:6px}
.main{padding:24px max(16px,env(safe-area-inset-left,0px)) calc(100px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px));max-width:1100px;width:100%;margin:0 auto;min-width:0}
@media (min-width:901px){.main{padding:32px 32px 48px}}
.topm{display:none}
@media (max-width:900px){.topm{display:flex;justify-content:space-between;align-items:center;padding-bottom:16px}}
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.ph h1{font-size:clamp(24px,3vw,32px)}
.ph p{margin:4px 0 0;color:var(--muted)}
.tabbar{display:none}
@media (max-width:900px){.tabbar{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));position:fixed;left:0;right:0;bottom:0;z-index:50;background:rgba(10,21,38,.95);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}}
.tabbar button{min-height:54px;border:0;background:transparent;color:var(--dim);font-size:11px;font-weight:800;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-radius:12px;cursor:pointer}
.tabbar button[aria-current=page]{color:var(--acc);background:var(--accSoft)}

.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:900px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;min-width:0}
.kpi .t{font-size:13px;color:var(--muted);font-weight:700}
.kpi b{display:block;font-family:var(--display);font-weight:800;font-size:clamp(22px,5vw,30px);margin-top:2px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kpi small{font-size:12.5px;color:var(--dim)}
.kpi.main{background:linear-gradient(135deg,var(--accSoft),transparent),var(--card);border-color:var(--accLine)}
.kpi.main b{color:var(--acc)}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);min-width:0}
.li:last-child{border-bottom:0}
.li .who{flex:1;min-width:0}
.li .who strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .who small{color:var(--dim);font-size:13px}
.av{width:38px;height:38px;border-radius:50%;background:var(--card2);color:var(--fg);display:grid;place-items:center;font-weight:800;flex-shrink:0;font-size:14px}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:16px}
table{width:100%;border-collapse:collapse;font-size:14.5px;min-width:620px}
th{text-align:left;font-size:12.5px;color:var(--dim);font-weight:800;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--bg2);white-space:nowrap}
td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
.drop{border:2px dashed var(--line2);border-radius:16px;padding:22px;text-align:center;cursor:pointer;display:flex;flex-direction:column;gap:4px;align-items:center}
.drop:hover,.drop.over{border-color:var(--acc);background:var(--accSoft)}
.swatches{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sw{width:36px;height:36px;border-radius:10px;border:2px solid transparent;cursor:pointer}
.sw[aria-pressed=true]{border-color:var(--fg);box-shadow:0 0 0 2px var(--bg) inset}
input[type=color]{width:44px;height:36px;border:1.5px solid var(--line2);border-radius:10px;background:var(--bg2);padding:2px;cursor:pointer}
.prevmsg{background:var(--bg2);border:1px solid var(--line);border-radius:14px 14px 14px 4px;padding:12px 14px;font-size:14.5px;white-space:pre-wrap;overflow-wrap:anywhere}
.qrbox{background:#fff;border-radius:16px;padding:14px;display:inline-block;line-height:0}
.qrbox canvas,.qrbox img{max-width:100%;height:auto}
.mq{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.mq:last-child{border-bottom:0}
/* Chat vendedor */
.chatwrap{display:grid;grid-template-columns:300px minmax(0,1fr);gap:14px}
@media (max-width:900px){.chatwrap{grid-template-columns:1fr}}
.leads{max-height:520px;overflow:auto}
.lead{display:flex;gap:10px;align-items:center;padding:10px;border-radius:12px;cursor:pointer;border:0;background:transparent;width:100%;text-align:left}
.lead:hover,.lead[aria-current=true]{background:var(--card2)}
.conv{display:flex;flex-direction:column;min-height:460px}
.msgs{flex:1;overflow:auto;display:flex;flex-direction:column;gap:8px;padding:14px;background:var(--bg2);border-radius:14px;max-height:440px;min-height:300px}
.m{max-width:82%;padding:9px 12px;border-radius:14px;font-size:14.5px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere}
.m.cliente{align-self:flex-end;background:#145C8F;border-top-right-radius:4px}
.m.vendedor{align-self:flex-start;background:var(--card2);border-top-left-radius:4px}
.m.dueño{align-self:flex-start;background:rgba(47,208,138,.16);border-top-left-radius:4px}
.m small{display:block;font-size:11px;color:var(--dim);margin-top:4px}
.composer{display:flex;gap:8px;margin-top:10px}
.composer input{flex:1;min-width:0}

/* Socio público */
.pub{max-width:560px;margin:0 auto;padding:20px max(16px,env(safe-area-inset-left,0px)) calc(40px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
.pub-h{display:flex;align-items:center;gap:12px}
.pub-h .lg{width:52px;height:52px;border-radius:14px;background:var(--acc);color:var(--accInk);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:22px;overflow:hidden;flex-shrink:0}
.pub-h .lg img{width:100%;height:100%;object-fit:cover}
.bigpct{font-family:var(--display);font-weight:800;font-size:clamp(64px,22vw,110px);line-height:.95;color:var(--acc);font-variant-numeric:tabular-nums}
.meter{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--acc);border-radius:99px;transition:width .6s}
.hours{display:flex;align-items:flex-end;gap:4px;height:90px}
.hours div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.hours i{display:block;width:100%;background:var(--line2);border-radius:4px 4px 0 0;min-height:3px}
.hours i.now{background:var(--acc)}
.hours span{font-size:10px;color:var(--dim);font-family:var(--mono)}
.tv .pub{max-width:none;min-height:100vh;justify-content:center}
.tv .bigpct{font-size:clamp(120px,22vw,300px)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{.sidebar,.tabbar,.topm,.noprint{display:none!important}.shell{display:block}body{background:#fff;color:#000}.card{border:0}}
</style>
</head>

/* ---------- Cálculos ---------- */
function memberState(m){
  var last=S.msgs.find(function(x){return x.member_id===m.id});
  var d=daysSince(m.last_visit),risk=S.gym.risk_days;
  if(last&&last.returned_at&&daysSince(last.returned_at)<=30)return {k:'volvio',t:'Volvió',c:'c-ok',msg:last};
  if(last&&!last.returned_at&&daysSince(last.sent_at)<=14)return {k:'enviado',t:'Mensaje enviado',c:'c-acc',msg:last};
  if(d==null)return {k:'sin',t:'Sin visitas',c:'c-dim'};
  if(d>=risk)return {k:'riesgo',t:'En riesgo',c:'c-warn'};
  return {k:'activo',t:'Activo',c:'c-ok'};
}
function monthStart(){var d=new Date();return new Date(d.getFullYear(),d.getMonth(),1)}
function stats(){
  var ms=monthStart(),back=S.msgs.filter(function(x){return x.returned_at&&new Date(x.returned_at)>=ms}).length;
  var sent=S.msgs.filter(function(x){return new Date(x.sent_at)>=ms}).length;
  var newM=S.leads.filter(function(l){return l.status==='socio'&&new Date(l.updated_at)>=ms}).length;
  var stay=S.gym.stay_minutes*60000,now=Date.now(),seen={};
  S.checkins.forEach(function(c){if(now-new Date(c.at).getTime()<stay)seen[c.member_id||c.id]=1});
  var inside=Object.keys(seen).length;
  var risk=S.members.filter(function(m){return memberState(m).k==='riesgo'});
  var today=new Date();today.setHours(0,0,0,0);
  var visitsToday=S.checkins.filter(function(c){return new Date(c.at)>=today}).length;
  return {back:back,sent:sent,newM:newM,rec:(back+newM)*S.gym.cuota,inside:inside,pct:Math.min(100,Math.round(100*inside/S.gym.capacity)),risk:risk,visitsToday:visitsToday};
}
async function sendRecover(m,btn){
  var url=waLink(m.phone,fillMsg(S.gym.recover_msg,m,S.gym));
  window.open(url,'_blank','noopener');
  if(btn)btn.disabled=true;
  var r=await sb.from('spot_messages').insert({gym_id:S.gym.id,member_id:m.id,kind:'recover'}).select().single();
  if(r.error){toast(errMsg(r.error),1);if(btn)btn.disabled=false;return}
  S.msgs.unshift(r.data);toast('Marcado como enviado. Si vuelve y escanea el QR, cuenta como recuperado.');renderView();
}

function parseRows(rows){
  rows=rows.map(function(r){return (r||[]).map(function(c){return c==null?'':String(c).trim()})}).filter(function(r){return r.some(Boolean)});
  if(!rows.length)return [];
  var h=-1,ni=-1,ai=-1,ti=-1;
  for(var y=0;y<Math.min(10,rows.length);y++){rows[y].forEach(function(v,x){var s=v.toLowerCase();
    if(ni<0&&/^(nombre|nombre y apellido|nombres?|socio|cliente|alumno)/.test(s))ni=x;else if(ai<0&&/^apellido/.test(s))ai=x;
    if(ti<0&&/(tel|cel|whats|m[oó]vil|contacto|n[uú]mero)/.test(s))ti=x});if(ni>=0||ti>=0){h=y;break}}
  var body=rows.slice(h+1),w=Math.max.apply(null,body.map(function(r){return r.length}));
  if(ti<0){for(var x=0;x<w;x++){if(body.filter(function(r){return digits(r[x]).length>=8}).length>body.length/2){ti=x;break}}}
  if(ni<0){for(var x2=0;x2<w;x2++){if(x2!==ti&&body.filter(function(r){return /[a-záéíóúñ]{2,}/i.test(r[x2]||'')}).length>body.length/2){ni=x2;break}}}
  if(ni<0||ti<0)return null;
  var out=[],seen={};
  body.forEach(function(r){var n=(r[ni]||'')+(ai>=0&&r[ai]?' '+r[ai]:''),p=normPhone(r[ti]);n=n.trim().slice(0,80);if(n&&p.length>=8&&p.length<=15&&!seen[p]){seen[p]=1;out.push({name:n,phone:p})}});
  return out;
}
function importFile(f){
  var box=$('#impRes');box.innerHTML='<div class="msgbox">Leyendo '+esc(f.name)+'…</div>';
  var rd=new FileReader();
  rd.onload=async function(){
    try{var wb=XLSX.read(new Uint8Array(rd.result),{type:'array'}),list=null;
      for(var i=0;i<wb.SheetNames.length;i++){list=parseRows(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[i]],{header:1,defval:'',raw:false}));if(list&&list.length)break}
      if(!list||!list.length){box.innerHTML='<div class="msgbox err">No encontramos socios en '+esc(f.name)+'. El archivo necesita una columna con el nombre y otra con el teléfono.</div>';return}
      var have={};S.members.forEach(function(m){have[m.phone]=1});
      var nuevos=list.filter(function(x){return !have[x.phone]}).map(function(x){return {gym_id:S.gym.id,name:x.name,phone:x.phone}});
      if(!nuevos.length){box.innerHTML='<div class="msgbox">Los '+list.length+' socios de '+esc(f.name)+' ya estaban cargados.</div>';return}
      box.innerHTML='<div class="msgbox">Guardando '+nuevos.length+' socios…</div>';
      for(var k=0;k<nuevos.length;k+=500){var r=await sb.from('spot_members').upsert(nuevos.slice(k,k+500),{onConflict:'gym_id,phone',ignoreDuplicates:true});if(r.error)throw r.error}
      await loadAll();vSocios($('#view'));
      $('#impRes').innerHTML='<div class="msgbox">Listo: cargamos '+nuevos.length+' socios nuevos'+(list.length-nuevos.length?' ('+(list.length-nuevos.length)+' ya estaban)':'')+'. Ej: '+esc(nuevos.slice(0,3).map(function(x){return x.name}).join(', '))+'.</div>';
    }catch(e){box.innerHTML='<div class="msgbox err">No pudimos cargar el archivo: '+esc(errMsg(e))+'. Probá guardarlo como .xlsx o .csv.</div>'}
  };
  rd.onerror=function(){box.innerHTML='<div class="msgbox err">No pudimos leer el archivo.</div>'};
  rd.readAsArrayBuffer(f);
}

    '<label class="field"><span>Nombre</span><input type="text" id="gN" maxlength="60" value="'+esc(g.name)+'"></label>'+
    '<div class="field"><span>Logo</span><div class="rowx"><span class="logo"><i style="width:56px;height:56px;border-radius:14px;font-size:20px" id="gLogoP">'+(g.logo_url?'<img src="'+esc(g.logo_url)+'" alt="">':esc(initials(g.name)))+'</i></span><label class="btn ghost sm" for="gLogo">Subir imagen</label><input type="file" id="gLogo" accept="image/png,image/jpeg,image/webp" hidden>'+(g.logo_url?'<button type="button" class="btn danger sm" id="gLogoDel">Quitar</button>':'')+'</div><small>PNG o JPG cuadrado, hasta 2 MB.</small></div>'+
    '<div class="field"><span>Color</span><div class="swatches" id="gSw">'+COLORS.map(function(c){return '<button type="button" class="sw" style="background:'+c+'" data-c="'+c+'" aria-label="Color '+c+'" aria-pressed="'+(c.toLowerCase()===color.toLowerCase())+'"></button>'}).join('')+'<input type="color" id="gC" value="'+esc(color)+'" aria-label="Otro color"></div></div>'+
    '<label class="field"><span>WhatsApp del gimnasio</span><input type="tel" id="gWa" value="'+esc(g.whatsapp||'')+'" placeholder="11 2345-6789"></label>'+
    '<label class="field"><span>Link de tus socios</span><input type="text" id="gS" maxlength="40" value="'+esc(g.slug)+'"><small>Si lo cambiás, tenés que volver a imprimir el QR.</small></label>'+
   '</section>'+
   '<section class="card stack"><h3 style="font-size:17px">Números del gimnasio</h3>'+
    '<div class="grid2"><label class="field"><span>Cuota mensual ($)</span><input type="number" id="gQ" min="0" step="500" value="'+g.cuota+'"><small>Para calcular la plata recuperada.</small></label>'+
    '<label class="field"><span>Capacidad</span><input type="number" id="gCap" min="5" max="5000" value="'+g.capacity+'"><small>Personas a la vez.</small></label>'+
    '<label class="field"><span>Tiempo promedio adentro (min)</span><input type="number" id="gSt" min="15" max="300" value="'+g.stay_minutes+'"><small>Para el % en vivo.</small></label>'+
    '<label class="field"><span>En riesgo después de (días)</span><input type="number" id="gR" min="3" max="90" value="'+g.risk_days+'"><small>Sin venir.</small></label></div>'+
   '</section></div>'+
   '<section class="card stack"><h3 style="font-size:17px">Mensaje para recuperar socios</h3>'+
    '<label class="field"><span>Texto</span><textarea id="gM" maxlength="700">'+esc(g.recover_msg)+'</textarea><small>Podés usar {nombre}, {gym} y {dias}. Sumale una promo para que vuelvan.</small></label>'+
    '<div class="field"><span>Así le llega a un socio</span><div class="prevmsg" id="gMP"></div></div>'+
   '</section>'+
   '<div class="rowx"><button class="btn" type="submit" id="gBtn">Guardar cambios</button><a class="btn ghost" href="?g='+esc(g.slug)+'" target="_blank" rel="noopener">Ver la app del socio</a></div>'+
  '</form>'+
  '<section class="card" style="margin-top:14px"><h3 style="font-size:17px">Tu cuenta</h3><p class="muted" style="margin:6px 0 12px">'+esc(S.user.email)+' · Prueba gratis de 7 días desde el '+new Date(g.created_at).toLocaleDateString('es-AR')+'.</p><div class="rowx"><a class="btn ghost sm" href="https://wa.me/'+SUPPORT+'?text='+encodeURIComponent('Hola, tengo una consulta sobre SPOT ('+g.name+')')+'" target="_blank" rel="noopener">Soporte por WhatsApp</a><button class="btn ghost sm" id="gOut">Salir</button></div></section>';
  function prev(){$('#gMP').textContent=fillMsg($('#gM').value,{name:'Martina Gómez',last_visit:new Date(Date.now()-12*86400000)},{name:$('#gN').value||g.name})}
  prev();$('#gM').oninput=prev;$('#gN').oninput=prev;
  $$('#gSw .sw').forEach(function(b){b.onclick=function(){color=b.dataset.c;$('#gC').value=color;mk();setAccent(color)}});
  $('#gC').oninput=function(){color=this.value;mk();setAccent(color)};
  function mk(){$$('#gSw .sw').forEach(function(x){x.setAttribute('aria-pressed',x.dataset.c.toLowerCase()===color.toLowerCase())})}
  $('#gS').oninput=function(){this.value=slugify(this.value)};
  $('#gOut').onclick=function(){clearInterval(S.poll);sb.auth.signOut()};
  $('#gLogo').onchange=async function(){var f=this.files[0];this.value='';if(!f)return;if(f.size>2*1024*1024){toast('La imagen pesa más de 2 MB',1);return}
    toast('Subiendo logo…');var path=S.user.id+'/logo-'+Date.now()+'.'+(f.type.split('/')[1]||'png');
    var up=await sb.storage.from('spot-logos').upload(path,f,{upsert:true,contentType:f.type});if(up.error){toast(errMsg(up.error),1);return}
    var url=sb.storage.from('spot-logos').getPublicUrl(path).data.publicUrl;
    var r=await sb.from('spot_gyms').update({logo_url:url}).eq('id',g.id);if(r.error){toast(errMsg(r.error),1);return}
    g.logo_url=url;toast('Logo actualizado');renderShell()};
  if($('#gLogoDel'))$('#gLogoDel').onclick=async function(){var r=await sb.from('spot_gyms').update({logo_url:null}).eq('id',g.id);if(r.error){toast(errMsg(r.error),1);return}g.logo_url=null;renderShell()};
  $('#gF').onsubmit=async function(e){e.preventDefault();
    var u={name:$('#gN').value.trim(),slug:slugify($('#gS').value),color:color,whatsapp:normPhone($('#gWa').value)||null,cuota:Math.max(0,+$('#gQ').value||0),capacity:Math.min(5000,Math.max(5,+$('#gCap').value||80)),stay_minutes:Math.min(300,Math.max(15,+$('#gSt').value||75)),risk_days:Math.min(90,Math.max(3,+$('#gR').value||10)),recover_msg:$('#gM').value.trim()||g.recover_msg};
    if(u.name.length<2){toast('Escribí el nombre del gimnasio',1);return}if(u.slug.length<3){toast('El link necesita al menos 3 letras',1);return}
    var b=$('#gBtn');b.disabled=true;var r=await sb.from('spot_gyms').update(u).eq('id',g.id).select().single();b.disabled=false;
    if(r.error){toast(errMsg(r.error),1);return}S.gym=r.data;setAccent(S.gym.color);toast('Cambios guardados');renderShell()};
}

/* =========================================================
   VISTA PÚBLICA DEL SOCIO (?g=slug)
   ========================================================= */
async function publicView(slug,machineId,tv){
  if(tv)document.body.classList.add('tv');
  var data=null,phoneKey='spot-phone-'+slug;
  function getPhone(){try{return localStorage.getItem(phoneKey)||''}catch(e){return ''}}
  function setPhone(p){try{localStorage.setItem(phoneKey,p)}catch(e){}}
  async function load(){var r=await sb.rpc('spot_public_gym',{p_slug:slug});if(r.error)throw r.error;return r.data}
  try{data=await load()}catch(e){root.innerHTML='<div class="pub"><div class="empty">No pudimos cargar el gimnasio. Revisá tu conexión.</div></div>';return}
  if(!data){root.innerHTML='<div class="pub"><div class="empty">No encontramos este gimnasio. Revisá el link o el QR.</div></div>';return}
  setAccent(data.color);document.title=data.name+' · SPOT';
  var result=null;
  function state(p){return p<50?['Hay lugar','var(--ok)']:(p<80?['Moderado','var(--warn)']:['Lleno','var(--bad)'])}
  function render(){
    var p=data.pct||0,st=state(p),free=Math.max(0,data.capacity-data.inside),nowH=new Date().getHours();
    var H={};(data.hours||[]).forEach(function(x){H[x.h]=x.n});var maxN=Math.max.apply(null,[1].concat(Object.keys(H).map(function(k){return H[k]})));
    var best=null;for(var h=nowH+1;h<=22;h++){if(H[h]!=null&&(best==null||H[h]<H[best]))best=h}
    var mq=machineId?(data.machines||[]).find(function(m){return m.id===machineId}):null;
    root.innerHTML='<div class="pub">'+
      '<header class="pub-h"><div class="lg">'+(data.logo_url?'<img src="'+esc(data.logo_url)+'" alt="">':esc(initials(data.name)))+'</div><div style="min-width:0"><h1 style="font-size:24px;overflow-wrap:anywhere">'+esc(data.name)+'</h1><span class="muted" style="font-size:13.5px">En vivo · se actualiza solo</span></div></header>'+
      (mq?'<section class="card stack" style="border-color:var(--accLine)"><span class="lbl">Máquina</span><h2 style="font-size:24px">'+esc(mq.name)+'</h2><span class="chip '+(mq.busy?'c-warn':'c-ok')+'" style="align-self:flex-start">'+(mq.busy?'En uso hasta las '+new Date(mq.until).toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'}):'Libre')+'</span>'+
         '<div class="rowx"><button class="btn" data-use="30">La estoy usando (30 min)</button>'+(mq.busy?'<button class="btn ghost" data-use="0">Ya la dejé libre</button>':'')+'</div></section>':'')+
      (tv?'':'<section class="card stack"><h3 style="font-size:18px">Marcá tu entrada</h3>'+
        (result?'<div class="msgbox'+(result.err?' err':'')+'" style="font-size:15px">'+result.t+'</div>':'')+
        '<form id="ck" class="composer" style="margin:0"><input type="tel" id="ckP" placeholder="Tu WhatsApp" value="'+esc(getPhone())+'" autocomplete="tel" aria-label="Tu número de WhatsApp"><button class="btn" type="submit" id="ckB">Entré</button></form>'+
        '<small class="muted">Sumás 10 puntos por visita. Tu número queda guardado en este celu.</small></section>')+
      '<section class="card stack"><span class="lbl">Qué tan lleno está ahora</span><div class="bigpct">'+p+'%</div><div class="meter"><i style="width:'+p+'%"></i></div>'+
        '<div class="between"><strong style="color:'+st[1]+';font-size:18px">'+st[0]+'</strong><span class="muted">'+free+' lugares libres</span></div>'+
        (best!=null?'<span class="muted" style="font-size:14px">Mejor horario hoy: <b style="color:var(--fg)">'+best+' h</b></span>':'')+'</section>'+
      ((data.hours||[]).length?'<section class="card"><span class="lbl">Gente por hora · promedio</span><div class="hours" style="margin-top:12px" role="img" aria-label="Gente por hora, de 7 a 22 h">'+
        [7,9,11,13,15,17,19,21].map(function(h){var v=((H[h]||0)+(H[h+1]||0))/2;return '<div><i class="'+(nowH===h||nowH===h+1?'now':'')+'" style="height:'+Math.max(4,Math.round(100*v/maxN))+'%"></i><span>'+h+'</span></div>'}).join('')+'</div></section>':'')+
      ((data.machines||[]).length?'<section class="card"><span class="lbl">Máquinas</span><div class="list" style="margin-top:6px">'+data.machines.map(function(m){return '<div class="li"><div class="who"><strong>'+esc(m.name)+'</strong></div><span class="chip '+(m.busy?'c-warn':'c-ok')+'">'+(m.busy?'En uso':'Libre')+'</span></div>'}).join('')+'</div></section>':'')+
      (tv?'':(data.schedule?'<section class="card"><span class="lbl">Horarios</span><p style="margin:6px 0 0;white-space:pre-wrap">'+esc(data.schedule)+'</p>'+(data.address?'<p class="muted" style="margin:6px 0 0">'+esc(data.address)+'</p>':'')+'</section>':'')+
        (data.whatsapp?'<a class="btn wa" href="https://wa.me/'+esc(data.whatsapp)+'" target="_blank" rel="noopener">Escribile al gimnasio</a>':''))+
      '<p class="muted" style="text-align:center;font-size:12.5px;margin:6px 0 0">Funciona con SPOT</p></div>';
    var f=$('#ck');if(f)f.onsubmit=async function(e){e.preventDefault();var ph=$('#ckP').value;if(digits(ph).length<8){result={t:'Escribí tu número de WhatsApp completo.',err:1};render();return}
      $('#ckB').disabled=true;var r=await sb.rpc('spot_do_checkin',{p_slug:slug,p_phone:ph});
      if(r.error){result={t:'Sin conexión. Probá de nuevo.',err:1};render();return}
      var d=r.data;
      if(!d.ok)result={t:d.error==='not_member'?'No encontramos ese número entre los socios. Pedile al gimnasio que te agregue.':'Revisá el número.',err:1};
      else{setPhone(ph);result={t:d.repeat?'Ya marcaste tu entrada hace un rato, '+esc(d.name)+'. ¡A entrenar!':(d.recovered?'¡Bienvenido de vuelta, '+esc(d.name)+'! Te extrañábamos. ':'¡Hola '+esc(d.name)+'! Entrada marcada. ')+'Tenés <b>'+d.points+' puntos</b>.'}}
      try{data=await load()}catch(e2){}render()};
    $$('[data-use]').forEach(function(b){b.onclick=async function(){b.disabled=true;var r=await sb.rpc('spot_use_machine',{p_slug:slug,p_machine:machineId,p_minutes:+b.dataset.use});
      if(r.error||!r.data.ok){toast('No se pudo actualizar',1);b.disabled=false;return}toast(+b.dataset.use?'Marcada en uso por 30 min':'Gracias por avisar');try{data=await load()}catch(e){}render()}});
  }
  render();
  setInterval(async function(){if(document.visibilityState!=='visible')return;if(document.activeElement&&document.activeElement.id==='ckP')return;try{data=await load();render()}catch(e){}},tv?20000:45000);
}
})();
</script>
</body>
</html>
